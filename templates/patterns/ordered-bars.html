<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/ev/base.css">
<link rel="stylesheet" href="/ev/theme.css">
<link rel="stylesheet" href="../style.css">
<script src="/ev/ev.js"></script>
<style>
.safe { justify-content: center; align-items: stretch; gap: 26px; }  /* rows fill the width */
.rank { display: grid; grid-template-columns: 300px 1fr 120px; gap: 24px; align-items: center; }
.track { height: 48px; }
.fill { height: 100%; background: var(--muted); border-radius: 8px; }
</style>
</head>
<body>
<div class="stage">
  <div class="safe">
    <div class="rank"><span class="label">Region A</span><div class="track"><div class="fill top" style="width: 92%"></div></div><span class="label">9.2</span></div>
    <div class="rank"><span class="label">Region B</span><div class="track"><div class="fill" style="width: 74%"></div></div><span class="label">7.4</span></div>
    <div class="rank"><span class="label">Region C</span><div class="track"><div class="fill" style="width: 51%"></div></div><span class="label">5.1</span></div>
    <div class="rank"><span class="label">Region D</span><div class="track"><div class="fill" style="width: 33%"></div></div><span class="label">3.3</span></div>
  </div>
</div>
<script>
// Pattern: ordered bars (docs/visual-patterns.md). Beat a: the bars grow in rank order. Beat b: rank 1 lights up.
// Copy it to scenes/<id>.html, then change the beat ids, the words, and the numbers to your script's.
const { at } = EV;
EV.from(".fill", { width: 0, duration: 0.6, stagger: 0.25 }, at("a"));
EV.to(".top", { backgroundColor: "var(--accent)", duration: 0.4 }, at("b"));
EV.ready();
</script>
</body>
</html>
