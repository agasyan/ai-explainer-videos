<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/ev/base.css">
<link rel="stylesheet" href="/ev/theme.css">
<link rel="stylesheet" href="../style.css">
<script src="/ev/ev.js"></script>
</head>
<body>
<div class="stage">
  <div class="safe">
    <h1 class="title">__TITLE__</h1>
    <svg viewBox="0 0 800 200" width="800" height="200">
      <path class="curve" d="M 20 180 C 220 0, 580 0, 780 180" fill="none" stroke="var(--accent)"
            stroke-width="10" stroke-linecap="round"/>
    </svg>
    <div class="row">
      <div class="card label step">Problem</div>
      <div class="card label step">Idea</div>
      <div class="card label step">Example</div>
    </div>
  </div>
</div>
<script>
const { at } = EV;
EV.from(".title", { opacity: 0, y: 40, duration: 0.8 }, at("hook"));
EV.draw(".curve", at("hook", "know"), 1.2);
["problem", "idea", "example"].forEach((word, i) =>
  EV.from(`.step:nth-child(${i + 1})`, { opacity: 0, y: 30, duration: 0.4 }, at("plan", word)));
EV.ready();
</script>
</body>
</html>
