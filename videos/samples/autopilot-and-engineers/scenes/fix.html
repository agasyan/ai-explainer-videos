<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/ev/base.css">
<link rel="stylesheet" href="/ev/theme.css">
<link rel="stylesheet" href="../style.css">
<script src="/ev/ev.js"></script>
<style>
  /* flow treatment: three boxes joined by thin wires; a cyan marker moves one step at a time. */
  .flow { position: relative; width: 1720px; height: 220px; }
  .flow .flow-box { position: absolute; top: 0; width: 460px; height: 220px; padding: 20px 24px;
                    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .flow .b1 { left: 0; } .flow .b2 { left: 630px; } .flow .b3 { left: 1260px; }
  .flow .txt { color: var(--ink); line-height: 1.12; margin-top: 10px; }
  .flow .b3 .txt { color: var(--normal); }
  .flow svg { position: absolute; left: 0; top: 0; }
  .flow .wire.base { stroke: var(--muted); }
  .next { align-self: flex-end; }
</style>
</head>
<body>
<div class="stage">
  <div class="safe">
    <div class="flow">
      <svg width="1720" height="220" viewBox="0 0 1720 220">
        <path class="wire base" d="M 460 110 H 630"/>
        <path class="wire base" d="M 1090 110 H 1260"/>
        <path id="w1" class="wire auto" d="M 460 110 H 630"/>
        <path id="w2" class="wire auto" d="M 1090 110 H 1260"/>
        <path id="r1" d="M 478 110 H 612" fill="none" stroke="none"/>
        <path id="r2" d="M 1108 110 H 1242" fill="none" stroke="none"/>
        <path class="marker m1" d="M -10 -12 L 12 0 L -10 12 Z"/>
        <path class="marker m2" d="M -10 -12 L 12 0 L -10 12 Z"/>
      </svg>
      <div class="flow-box b1"><span class="step">1/3</span><div class="txt">FAA <span class="muted">2013</span><br>MORE HAND FLYING</div></div>
      <div class="flow-box b2"><span class="step">2/3</span><div class="txt">SIMULATOR<br>STALL RECOVERY</div></div>
      <div class="flow-box b3"><span class="step">3/3</span><div class="txt">PILOT IN<br>COMMAND</div></div>
    </div>
    <div class="tag muted next">NEXT · PART 3/3</div>
  </div>
</div>
<script>
const { at } = EV;

// guidance: the flow appears with only its step labels; box 1/3 lights on "F A A".
EV.from(".flow-box", { opacity: 0, stagger: 0.08 }, at("guidance"));
EV.draw(".flow .base", at("guidance") + 0.2, 0.6, { stagger: 0.1, ease: "power2.out" });
EV.to(".b1", { borderColor: "var(--auto)" }, at("guidance", "F"));
EV.from(".b1 .txt", { opacity: 0 }, at("guidance", "F"));
EV.from(".m1", { opacity: 0 }, at("guidance", "F") + 0.16);

// simulator: the marker moves to box 2/3, which lights on "stall".
EV.path(".m1", "#r1", at("simulator", "pilots"), 0.9, { ease: "power2.inOut" });
EV.draw("#w1", at("simulator", "pilots"), 0.9, { ease: "power2.inOut" });
EV.to(".b2", { borderColor: "var(--auto)" }, at("simulator", "stall"));
EV.from(".b2 .txt", { opacity: 0 }, at("simulator", "stall"));

// command: the marker passes through box 2/3 and moves to box 3/3, which lights green on "authority".
EV.to(".m1", { opacity: 0, duration: 0.3 }, at("command"));
EV.from(".m2", { opacity: 0, duration: 0.3 }, at("command"));
EV.path(".m2", "#r2", at("command", "stays"), 0.9, { ease: "power2.inOut" });
EV.draw("#w2", at("command", "stays"), 0.9, { ease: "power2.inOut" });
EV.to(".b3", { borderColor: "var(--normal)" }, at("command", "authority"));
EV.from(".b3 .txt", { opacity: 0 }, at("command", "authority"));
EV.from(".next", { opacity: 0 }, at("command", "next"));

EV.ready();
</script>
</body>
</html>
