<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/ev/base.css">
<link rel="stylesheet" href="/ev/theme.css">
<link rel="stylesheet" href="../style.css">
<script src="/ev/ev.js"></script>
<style>
  /* Positions are in .safe coordinates (1728 x 808). */
  .top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: center; }
  .ttl { font-family: var(--display); font-size: 60px; font-weight: 700; line-height: 1.05; letter-spacing: 0.04em;
         text-transform: uppercase; color: var(--human); border: var(--stroke) solid var(--line);
         border-radius: var(--radius); padding: 18px 40px; white-space: nowrap; }
  .ttl .by { font-family: var(--mono); font-size: 32px; font-weight: 400; letter-spacing: 0.08em; color: var(--muted);
             margin-left: 20px; }
  .art { position: absolute; left: 0; top: 0; }
  .tape-box { fill: var(--panel); stroke: var(--muted); stroke-width: 2; }
  .grad { stroke: var(--muted); stroke-width: 2; }
  .tk { stroke-width: 5; }
  #tickH { stroke-width: 8; }
  #lvl { fill: var(--human); opacity: 0.2; }
  .lbl { position: absolute; font-size: 36px; line-height: 44px; }
  #lA { left: 374px; width: 300px; top: 662px; text-align: center; }
  #lH { left: 1054px; width: 300px; top: 662px; text-align: center; }
  #easy { left: 230px; width: 200px; top: 448px; text-align: right; }
  #hard { left: 1298px; top: 168px; }
  /* HAND SKILL: a white boxed readout whose pointer touches the HUMAN tape. */
  .skill { position: absolute; right: 598px; top: 156px; display: flex; align-items: center; }
  .skill .readout { font-size: 40px; padding: 12px 20px; color: var(--human); }
  .skill .ptr { color: var(--human); display: block; }
</style>
</head>
<body>
<div class="stage">
  <div class="safe">
    <div class="top"><div class="ttl" id="ttl"><span>Ironies of automation</span><span class="by">· BAINBRIDGE 1983</span></div></div>
    <svg class="art" width="1728" height="808" viewBox="0 0 1728 808"></svg>
    <div class="cap lbl auto" id="lA">AUTOMATION</div>
    <div class="cap lbl human" id="lH">HUMAN</div>
    <div class="cap lbl auto" id="easy">EASY</div>
    <div class="cap lbl caution" id="hard">HARDEST</div>
    <div class="skill" id="skill">
      <div class="readout">HAND SKILL</div>
      <svg class="ptr" viewBox="0 0 24 32" width="24" height="32"><polygon points="0,0 24,16 0,32" fill="currentColor"/></svg>
    </div>
  </div>
</div>
<script>
const { at } = EV;

// Two tapes on the same scale: easy at the bottom, hardest at the top.
const NS = "http://www.w3.org/2000/svg";
const art = document.querySelector(".art");
const el = (tag, attrs, parent) => {
  const e = parent.appendChild(document.createElementNS(NS, tag));
  Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
  return e;
};
const TOP = 160, H = 480, W = 140, XA = 454, XH = 1134;
[["tapeA", XA], ["tapeH", XH]].forEach(([id, x]) => {
  const g = el("g", { id, class: "tape" }, art);
  el("rect", { x, y: TOP, width: W, height: H, rx: 4, class: "tape-box" }, g);
  for (let i = 1; i < 10; i++) {
    const y = TOP + (i * H) / 10;
    el("line", { x1: x, y1: y, x2: x + (i === 5 ? 26 : 14), y2: y, class: "grad" }, g);
  }
});
// AUTOMATION: many cyan ticks in the easy part, from the bottom up.
for (let i = 0; i < 16; i++) {
  const y = 620 - i * 20;
  el("line", { x1: XA + 34, y1: y, x2: XA + W - 14, y2: y, class: "wire auto tk" }, art);
}
// HUMAN: the hand skill level (a faint bar, under the pointer), and one amber tick at the top, the hardest moment.
el("rect", { x: XH + 34, y: 190, width: W - 48, height: 450, id: "lvl" }, art);
el("line", { x1: XH + 34, y1: 190, x2: XH + W - 14, y2: 190, class: "wire caution", id: "tickH" }, art);

// named: the paper, then two empty tapes with one label each
EV.from("#ttl", { opacity: 0 }, at("named", "nineteen"));
EV.from(".tape", { opacity: 0, stagger: 0.08 }, at("named", "calls"));
EV.from("#lA, #lH", { opacity: 0, stagger: 0.08 }, at("named", "irony"));
// hardest: the title goes; easy ticks fill the AUTOMATION tape; one amber tick on the HUMAN tape
EV.to("#ttl", { opacity: 0 }, at("hardest"));
EV.from(".tk", { opacity: 0, duration: 0.3, stagger: 0.06 }, at("hardest", "easy"));
EV.from("#easy", { opacity: 0 }, at("hardest", "parts"));
EV.from("#tickH, #hard", { opacity: 0 }, at("hardest", "hardest"));
// fade: HAND SKILL slides down the HUMAN tape, from high to low, and turns amber
EV.to("#easy", { opacity: 0 }, at("fade"));
EV.to(".tk", { opacity: 0.35 }, at("fade"));
EV.from("#skill, #lvl", { opacity: 0 }, at("fade", "skill"));
EV.to("#skill", { y: 410, duration: 1.3, ease: "power2.inOut" }, at("fade", "not"));
EV.to("#lvl", { attr: { y: 600, height: 40 }, duration: 1.3, ease: "power2.inOut" }, at("fade", "not"));
EV.to("#skill .readout, #skill .ptr", { color: "var(--caution)", duration: 0.3 }, at("fade", "fade"));
EV.to("#lvl", { fill: "var(--caution)", duration: 0.3 }, at("fade", "fade"));
EV.ready();
</script>
</body>
</html>
